<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231f6feb%27/%3E%3Cpath d=%27M6 12h13a3 3 0 1 0-3-3M6 17h18a3 3 0 1 1-3 3M6 22h9%27 stroke=%27white%27 stroke-width=%272.4%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
    <title>Wind Day-Ahead Desk</title>
    <!-- Start fetching the first view's data before the JS bundle has loaded (static JSON from the CDN).
         2026-01-15 is the Decision view's default day (DEFAULT_DAY in DecisionView.jsx). -->
    <script>
      (function () {
        var h = location.hash.slice(1), u = null;
        if (h === "accuracy") u = "/precomputed/accuracy.json";
        else if (h !== "guide") u = "/precomputed/decision/2026-01-15.json";
        ["/precomputed/meta.json", u].forEach(function (href) {
          if (!href) return;
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "fetch"; l.href = href; l.crossOrigin = "anonymous";
          document.head.appendChild(l);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
